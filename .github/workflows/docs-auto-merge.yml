name: Auto-merge documentation dependencies

on:
    pull_request_target:
        types: [opened, reopened, synchronize]
        branches: [main]

permissions: {}

concurrency:
    group: docs-auto-merge-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2.3.0
              id: metadata
              with:
                  github-token: ${{ github.token }}
            - name: Enable auto-merge for docs minor and patch updates
              if: >-
                  steps.metadata.outputs.directory == '/docs' &&
                  steps.metadata.outputs.dependency-type == 'direct:production' &&
                  contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
              run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
