name: Deploy documentation

on:
    push:
        branches: [main]
        paths: ['docs/**', 'src/**', 'index.ts', 'vite.config.ts', '.github/workflows/docs.yml']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
    cancel-in-progress: false

jobs:
    build:
        name: Docs smoke test
        runs-on: ubuntu-24.04
        steps:
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              if: github.event_name == 'pull_request'
              id: filter
              with:
                  filters: |
                      docs:
                        - 'docs/**'
                        - 'src/**'
                        - 'index.ts'
                        - 'vite.config.ts'
                        - '.github/workflows/docs.yml'
            - uses: actions/checkout@v4
              if: github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true'
            - uses: actions/setup-node@v4
              if: github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true'
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: docs/package.json
            - name: Build and smoke-test docs
              if: github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true'
              working-directory: docs
              run: |
                  npm install --no-package-lock
                  npm run compat:check
                  npm run build
                  node scripts/smoke-test.mjs
            - uses: actions/upload-pages-artifact@v3
              if: github.event_name != 'pull_request'
              with:
                  path: docs/dist
    consumers:
        if: github.event_name != 'pull_request'
        uses: ./.github/workflows/package-matrix.yml
    deploy:
        if: github.event_name != 'pull_request'
        needs: [build, consumers]
        runs-on: ubuntu-24.04
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
