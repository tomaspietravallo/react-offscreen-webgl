name: Publish to npm

on:
    push:
        branches: [main]

concurrency:
    group: npm-publish-main
    queue: max

permissions:
    contents: read

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.release.outputs.publish }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - run: node --test scripts/release.test.mjs
            - name: Determine release
              id: release
              env:
                  BEFORE_SHA: ${{ github.event.before }}
              run: node scripts/release.mjs

    test:
        needs: plan
        if: needs.plan.outputs.publish == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:unit
            - run: npm run test:browser

    publish:
        needs: [plan, test]
        if: needs.plan.outputs.publish == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
            - run: npm ci
            - name: Prepare version and description
              env:
                  BEFORE_SHA: ${{ github.event.before }}
              run: node scripts/release.mjs --apply
            - run: npm run build
            - run: npm publish --provenance --access public
